<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="refresh" content="0;url=https://naxel-tech.vercel.app/care/" />
    <title>Naxel Care mudou de endereço</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061b35;color:#fff;font:16px/1.6 Inter,system-ui,sans-serif}
      main{max-width:560px;padding:40px;text-align:center}a{color:#d7aa55;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <h1>Naxel Care mudou de endereço</h1>
      <p>Você será direcionado para a nova versão hospedada no site oficial da Naxel.</p>
      <p><a href="https://naxel-tech.vercel.app/care/">Abrir Naxel Care</a></p>
    </main>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(items => items.forEach(item => item.unregister()));
      if ('caches' in window) caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
      location.replace('https://naxel-tech.vercel.app/care/');
    </script>
  </body>
</html>
